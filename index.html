const key='science115v2';let state;try{state=JSON.parse(localStorage.getItem(key))||{done:{},attempts:[],wrong:{}}}catch{state={done:{},attempts:[],wrong:{}}}let view='home',current='p1',section=0,answers={},submitted=false,quizSet=null,reviewMode=false;
function shuffled(n){let a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(review=false){reviewMode=review;let ids=review?Object.keys(state.wrong).filter(k=>state.wrong[k]>0&&k.startsWith(current+':')).map(k=>+k.split(':')[1]):shuffled(bank[current].length).slice(0,Math.min(20,bank[current].length));if(!ids.length){alert('本章目前沒有待複習錯題。');return}quizSet=ids.map(idx=>({idx,order:shuffled(4)}));answers={};submitted=false;view='quiz';render()}
function quizQuestions(){return quizSet.map(o=>{let x=bank[current][o.idx];return [x[0],o.order.map(j=>x[1][j]),o.order.indexOf(x[2]),x[3],x[4],o.idx]})}
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(key,JSON.stringify(state)),course=()=>courses.find(c=>c.id===current),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tabs(){let items=[['home','課程總覽'],['lesson','課堂教學'],['quiz','章節測驗'],['wrong','錯題複習'],['record','學習紀錄']];$('#tabs').innerHTML=items.map(([id,label])=>`<button class="${view===id?'active':'secondary'}" onclick="go('${id}')">${label}</button>`).join('')}function go(v,id){if(id)current=id;if(v==='quiz'){startQuiz(false);return}view=v;submitted=false;answers={};render()}function picker(){return `<label>選擇課程： <select onchange="current=this.value;section=0;answers={};submitted=false;if(view==='quiz'){startQuiz(false)}else render()">${courses.map(c=>`<option value="${c.id}" ${c.id===current?'selected':''}>${esc(c.subject+'｜'+c.name)}</option>`).join('')}</select></label>`}function render(){tabs();let out='';if(view==='home'){out=`<section class="panel"><h2>歡迎回到理科學習室</h2><p class="muted">選擇科目，先理解觀念，再挑戰題目；錯題會自動加入複習清單。</p><div class="grid">${courses.map(c=>{let done=c.sections.filter((_,i)=>state.done[c.id+':'+i]).length;return `<article class="course"><span class="pill">${c.subject}</span><h3>${esc(c.name)}</h3><p class="muted">${esc(c.status)}</p><div class="progress"><span style="width:${100*done/c.sections.length}%"></span></div><p>${done} / ${c.sections.length} 節已學</p><button class="primary" onclick="go('lesson','${c.id}')">開始學習</button> <button class="secondary" onclick="go('quiz','${c.id}')">開始測驗</button></article>`}).join('')}</div></section><section class="panel"><h3>使用提醒</h3><p>本原型包含三個示範章節、每章20道原創題目。每次測驗隨機抽題並重排選項，支援錯題再測與本機紀錄。正式翰林版章節內容需以課本目錄校對後擴充。</p></section>`}else if(view==='lesson'){let c=course(),s=c.sections[section];out=`<section class="panel">${picker()}<h2 style="margin-top:20px">${esc(s.title)}</h2><p class="pill">${section+1} / ${c.sections.length} 節</p><div class="lesson">${s.body.map((p,i)=>`<h3>重點 ${i+1}</h3><p>${esc(p)}</p>`).join('')}<div class="highlight"><strong>記憶口訣</strong><p>${esc(s.memory)}</p></div><h3>老師舉例</h3><p>${esc(s.example)}</p></div><p><button class="primary" onclick="complete()">${state.done[c.id+':'+section]?'已完成 ✓（再次確認）':'我已學會這一節 ✓'}</button> <button class="secondary" onclick="section=Math.max(0,section-1);render()">上一節</button> <button class="secondary" onclick="section=Math.min(course().sections.length-1,section+1);render()">下一節</button></p><p class="muted">每節完成後可進行章節測驗。</p></section>`}else if(view==='quiz'){let q=quizQuestions();out=`<section class="panel">${picker()}<h2 style="margin-top:20px">章節測驗</h2><p class="muted">共 ${q.length} 題（${reviewMode?'錯題再測':'隨機抽題與選項重排'}）。交卷後顯示分數與解析，並記錄錯題。</p>${q.map((x,i)=>`<div class="question"><strong>第 ${i+1} 題｜${esc(x[0])}</strong>${x[1].map((op,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''} ${submitted?'disabled':''} onchange="answers[${i}]=${j}"> ${String.fromCharCode(65+j)}. ${esc(op)}</label>`).join('')}${submitted?`<div class="feedback"><strong class="${answers[i]===x[2]?'correct':'wrong'}">${answers[i]===x[2]?'答對':'答錯'}｜正解 ${String.fromCharCode(65+x[2])}</strong><p>${esc(x[3])}</p></div>`:''}</div>`).join('')}${submitted?`<div class="highlight"><h2>本次成績：${q.filter((x,i)=>answers[i]===x[2]).length} / ${q.length} 題</h2><button class="primary" onclick="go('wrong')">查看錯題本</button> <button class="secondary" onclick="startQuiz(false)">重新隨機抽題</button></div>`:`<button class="primary" onclick="submitQuiz()">交卷並查看解析</button>`}</section>`}else if(view==='wrong'){let keys=Object.keys(state.wrong).filter(k=>state.wrong[k]>0);out=`<section class="panel"><h2>錯題複習</h2><p class="muted">依累計答錯次數顯示。請選擇科目後進行錯題再測，答對會自動移出待複習。</p>${picker()}<p><button class="primary" onclick="startQuiz(true)">開始本章錯題再測</button></p>${keys.length?keys.map(k=>{let [id,idx]=k.split(':'),c=courses.find(c=>c.id===id),q=bank[id][+idx];return `<div class="question"><span class="pill">${c.subject}｜錯 ${state.wrong[k]} 次</span><h3>${esc(q[0])}</h3><p>正解：${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><div class="feedback">${esc(q[3])}</div><p><button class="secondary" onclick="master('${k}')">標記已理解</button></p></div>`}).join(''):'<p>目前沒有待複習錯題。完成章節測驗後會自動整理。</p>'}</section>`}else{let attempts=state.attempts,done=Object.keys(state.done).filter(k=>state.done[k]).length,wrong=Object.values(state.wrong).filter(x=>x>0).length;out=`<section class="panel"><h2>學習紀錄</h2><div class="grid"><div class="course"><div class="stat">${done}</div>完成節數</div><div class="course"><div class="stat">${attempts.length}</div>測驗次數</div><div class="course"><div class="stat">${wrong}</div>待複習錯題</div></div><h3>測驗歷史</h3>${attempts.length?`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th align="left">時間</th><th align="left">章節</th><th align="left">成績</th><th align="left">模式</th></tr>${attempts.slice().reverse().map(a=>`<tr><td style="padding:10px;border-bottom:1px solid #eee">${esc(a.date)}</td><td>${esc(courses.find(c=>c.id===a.id).name)}</td><td>${a.score}/${a.total}</td><td>${esc(a.mode||'章節測驗')}</td></tr>`).join('')}</table></div>`:'<p class="muted">尚無測驗紀錄。</p>'}<h3>資料管理</h3><button class="secondary" onclick="exportData()">匯出學習紀錄 JSON</button> <button class="secondary" onclick="resetData()">清除本機紀錄</button><p class="muted">資料僅存在目前瀏覽器；清除瀏覽器資料可能導致紀錄消失。建議定期匯出備份。</p></section>`}$('#app').innerHTML=out}function complete(){state.done[current+':'+section]=true;save();if(section<course().sections.length-1)section++;render()}function submitQuiz(){let q=quizQuestions();if(q.some((_,i)=>answers[i]===undefined)){alert('請先完成所有題目，再交卷。');return}let score=0;q.forEach((x,i)=>{if(answers[i]===x[2]){score++;if(reviewMode)delete state.wrong[current+':'+x[5]]}else{let k=current+':'+x[5];state.wrong[k]=(state.wrong[k]||0)+1}});state.attempts.push({id:current,score,total:q.length,mode:reviewMode?'錯題再測':'隨機測驗',date:new Date().toLocaleString('zh-TW')});save();submitted=true;render()}function master(k){delete state.wrong[k];save();render()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='高一理科學習紀錄.json';a.click();URL.revokeObjectURL(url)}function resetData(){if(confirm('確定清除所有學習紀錄？此操作無法復原。')){state={done:{},attempts:[],wrong:{}};save();render()}}render();</script></body></html>
